# Traefik dynamic configuration — per-service routers
# Hot-reloaded. Edit hostnames to match your deployment environment.
# Place at: $AI_STACK_DIR/configs/traefik/dynamic/services.yaml
#
# Hostname convention:
#   Internal (localhost): *.stack.localhost
#   LAN/WAN: configure your DNS to point these names to this host.
#
# Security policy: every router MUST include the `authentik` middleware
# unless a documented exception exists (see docs/security-policy.md).

http:
  routers:
    openwebui:
      rule: "Host(`openwebui.stack.localhost`)"
      entryPoints:
        - websecure
      service: openwebui
      middlewares:
        - authentik
        - secure-headers
        - nocache
      tls: {}

    grafana:
      rule: "Host(`grafana.stack.localhost`)"
      entryPoints:
        - websecure
      service: grafana
      middlewares:
        - authentik
        - secure-headers
      tls: {}

    prometheus:
      rule: "Host(`prometheus.stack.localhost`)"
      entryPoints:
        - websecure
      service: prometheus
      middlewares:
        - authentik
        - secure-headers
      tls: {}

    # Note: auth.stack.localhost router removed — Authentik now runs on
    # photondatum.space VPS. Access via https://auth.photondatum.space.

    # Exception: MCP + admin endpoints use API key auth (machine-to-machine, not browser SSO).
    # Access control: knowledge_index_api_key Podman secret (API_KEY env var in app).
    knowledge-index-admin:
      rule: "Host(`ki.stack.localhost`) && PathPrefix(`/admin`)"
      entryPoints:
        - websecure
      service: knowledge-index
      middlewares:
        - secure-headers
      tls: {}

    knowledge-index-mcp:
      rule: "Host(`ki.stack.localhost`) && PathPrefix(`/mcp`)"
      entryPoints:
        - websecure
      service: knowledge-index
      middlewares:
        - secure-headers
      tls: {}

    knowledge-index-api:
      rule: "Host(`ki.stack.localhost`) && PathPrefix(`/v1`)"
      entryPoints:
        - websecure
      service: knowledge-index
      middlewares:
        - authentik
        - ki-api-key
        - secure-headers
      tls: {}

    # Tailnet: /v1/* — worker queries, ingest, and /v1/cnc/* CNC namespace.
    # /v1/cnc/* is covered by this PathPrefix; no separate router needed (auth is
    # handled in app.py via CNC_BEARER_TOKEN, not a Traefik middleware).
    # Accessible only on the tailnet entrypoint (100.64.0.4:8443).
    knowledge-index-tailnet-api:
      rule: "Host(`100.64.0.4`) && PathPrefix(`/v1`)"
      entryPoints:
        - tailnet
      service: knowledge-index
      middlewares:
        - secure-headers
      tls: {}

    # Tailnet: /mcp/* — MCP tool server for future agentic worker access.
    knowledge-index-tailnet-mcp:
      rule: "Host(`100.64.0.4`) && PathPrefix(`/mcp`)"
      entryPoints:
        - tailnet
      service: knowledge-index
      middlewares:
        - secure-headers
      tls: {}

    litellm:
      rule: "Host(`litellm.stack.localhost`)"
      entryPoints:
        - websecure
      service: litellm
      middlewares:
        - authentik
        - secure-headers
      tls: {}

    # Public entry — litellm.photondatum.space proxied via Caddy on photondatum.space.
    # LiteLLM manages its own Authentik OAuth SSO (GENERIC_* env vars). No forwardAuth
    # middleware here — it would force two Authentik round-trips per session.
    litellm-public:
      rule: "Host(`litellm.photondatum.space`)"
      entryPoints:
        - websecure
      service: litellm
      middlewares:
        - secure-headers
      tls: {}

    qdrant:
      rule: "Host(`qdrant.stack.localhost`)"
      entryPoints:
        - websecure
      service: qdrant
      middlewares:
        - authentik
        - secure-headers
      tls: {}

    minio-console:
      rule: "Host(`minio.stack.localhost`)"
      entryPoints:
        - websecure
      service: minio-console
      middlewares:
        - authentik
        - secure-headers
      tls: {}

    homepage:
      rule: "Host(`dashboard.stack.localhost`)"
      entryPoints:
        - websecure
      service: homepage
      middlewares:
        - authentik
        - secure-headers
      tls: {}

    # Public entry — flowise.photondatum.space proxied via Caddy on photondatum.space.
    flowise-public:
      rule: "Host(`flowise.photondatum.space`)"
      entryPoints:
        - websecure
      service: flowise
      middlewares:
        - authentik
        - secure-headers
      tls: {}

    # SvelteKit static assets and WebSocket — no forwardAuth on these paths.
    # /_app/*: hashed immutable JS/CSS bundles + version.json. Bypassing auth prevents
    # SvelteKit's background version.json poll from 302ing to Authentik cross-origin
    # (fetch() can't complete a login redirect → CORS failure → error boundary).
    # /ws/*: Socket.IO WebSocket. WebSocket upgrades can't follow 302 redirects, so
    # Authentik forwardAuth must not intercept them. OpenWebUI's own JWT gates these.
    openwebui-public-static:
      rule: "Host(`agent.photondatum.space`) && (PathPrefix(`/_app`) || PathPrefix(`/ws`))"
      entryPoints:
        - websecure
      service: openwebui
      middlewares:
        - secure-headers
      tls: {}

    openwebui-static:
      rule: "Host(`openwebui.stack.localhost`) && (PathPrefix(`/_app`) || PathPrefix(`/ws`))"
      entryPoints:
        - websecure
      service: openwebui
      middlewares:
        - secure-headers
      tls: {}

    # Public entry — agent.photondatum.space proxied via Caddy on photondatum.space.
    # Caddy forwards Host: agent.photondatum.space so this router matches.
    # Authentik is now on the VPS (always-on), so forwardAuth works for external browsers.
    openwebui-public:
      rule: "Host(`agent.photondatum.space`)"
      entryPoints:
        - websecure
      service: openwebui
      middlewares:
        - authentik
        - secure-headers
        - nocache
      tls: {}

    # Public entry — dashboard.photondatum.space proxied via Caddy on photondatum.space.
    homepage-public:
      rule: "Host(`dashboard.photondatum.space`)"
      entryPoints:
        - websecure
      service: homepage
      middlewares:
        - authentik
        - secure-headers
      tls: {}

    # Public entry — ki.photondatum.space proxied via Caddy on photondatum.space.
    # Root path: redirect to /admin for browser users navigating to the base URL.
    ki-public-root:
      rule: "Host(`ki.photondatum.space`) && Path(`/`)"
      entryPoints:
        - websecure
      middlewares:
        - redirect-to-admin
        - secure-headers
      service: knowledge-index
      tls: {}

    # /admin: browser admin panel, protected by Authentik.
    # /v1 and /mcp: machine-to-machine API key auth at app level; no Authentik middleware.
    ki-public-admin:
      rule: "Host(`ki.photondatum.space`) && PathPrefix(`/admin`)"
      entryPoints:
        - websecure
      service: knowledge-index
      middlewares:
        - authentik
        - ki-api-key
        - secure-headers
      tls: {}

    ki-public-api:
      rule: "Host(`ki.photondatum.space`) && PathPrefix(`/v1`)"
      entryPoints:
        - websecure
      service: knowledge-index
      middlewares:
        - secure-headers
      tls: {}

    ki-public-mcp:
      rule: "Host(`ki.photondatum.space`) && PathPrefix(`/mcp`)"
      entryPoints:
        - websecure
      service: knowledge-index
      middlewares:
        - secure-headers
      tls: {}

  services:
    openwebui:
      loadBalancer:
        servers:
          - url: "http://webui.ai-stack:8080"

    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus.ai-stack:9090"

    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana.ai-stack:3000"

    flowise:
      loadBalancer:
        servers:
          - url: "http://flowise.ai-stack:3000"

    knowledge-index:
      loadBalancer:
        servers:
          - url: "http://knowledge-index.ai-stack:8100"

    litellm:
      loadBalancer:
        servers:
          - url: "http://litellm.ai-stack:4000"

    qdrant:
      loadBalancer:
        servers:
          - url: "http://qdrant.ai-stack:6333"

    minio-console:
      loadBalancer:
        servers:
          - url: "http://minio.ai-stack:9001"

    homepage:
      loadBalancer:
        servers:
          - url: "http://homepage.ai-stack:3000"
