# Traefik dynamic configuration — global middlewares
# Hot-reloaded by Traefik. No container restart needed.
# Place at: $AI_STACK_DIR/configs/traefik/dynamic/middlewares.yaml

http:
  middlewares:
    # Redirect HTTP to HTTPS (applied via entrypoint redirect in traefik.yaml)
    # This redirect-to-https middleware can be reused explicitly on routers if needed
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

    # Secure response headers — applied to all user-facing routers
    secure-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: strict-origin-when-cross-origin
        forceSTSHeader: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    # Redirect bare / to /admin/v1/nodes (used by ki-public-root router)
    redirect-to-admin:
      redirectRegex:
        regex: "^(https?://[^/]+)/?$"
        replacement: "${1}/admin/v1/nodes"
        permanent: false

    # Authentik forward-auth middleware
    # Authentik runs on photondatum.space (always-on VPS edge node).
    # CENTAURI services degrade gracefully when the VPS is unreachable —
    # LAN/tailnet access remains up but auth checks will fail until it recovers.
    # Prevent browsers from caching dynamic/auth-gated responses.
    # Applied to routers that serve OpenWebUI pages and API calls so that
    # an expired Authentik proxy session always triggers a fresh forwardAuth
    # check rather than replaying a cached HTML response.
    # NOT applied to /_app/* static asset routers (immutable hashed files).
    nocache:
      headers:
        customResponseHeaders:
          Cache-Control: "no-store, no-cache, must-revalidate"

    authentik:
      forwardAuth:
        address: "https://auth.photondatum.space/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
