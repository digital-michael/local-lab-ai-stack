# Grafana configuration
# Place at: $AI_STACK_DIR/configs/grafana/grafana.ini
# Mounted at /etc/grafana inside the grafana container.
# Datasources are provisioned automatically — see provisioning/datasources/

[server]
http_port = 3000
domain = grafana.stack.localhost
root_url = https://grafana.stack.localhost

[analytics]
reporting_enabled = false
check_for_updates = false

[security]
admin_user = admin
admin_password = admin
disable_gravatar = true

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Admin

[auth]
disable_login_form = true
disable_signout_menu = false

[auth.proxy]
enabled = true
header_name = X-authentik-username
header_property = username
auto_sign_up = true
sync_ttl = 60
whitelist = 10.89.0.0/24
headers = Email:X-authentik-email Name:X-authentik-name

[paths]
provisioning = /etc/grafana/provisioning

[log]
mode = console
level = info
